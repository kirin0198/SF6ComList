# docker-compose.yml — SF6 コンボ帳 ローカル開発環境
# `docker compose up` でワンコマンド起動

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # ホストユーザーのUID/GIDで実行し、ボリューム書き込み権限を確保
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:3000"
    environment:
      # データベース（ボリュームマウント先）
      DATABASE_URL: "file:/app/data/sf6combo.db"
      # Auth.js シークレット（必須: .env に設定すること。生成: openssl rand -base64 32）
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET is required. Run: openssl rand -base64 32}"
      AUTH_URL: "${AUTH_URL:-http://localhost:3000}"
      NODE_ENV: "production"
    volumes:
      # SQLite DB ファイルをホストの ./data に永続化
      - ./data:/app/data
    restart: unless-stopped
