# デプロイワークフロー — main ブランチへのマージ時に Cloud Run へデプロイ
#
# 前提条件（Google Cloud 側の設定）:
#   1. Artifact Registry リポジトリの作成
#      gcloud artifacts repositories create sf6comlist \
#        --repository-format=docker \
#        --location=asia-northeast1
#
#   2. Workload Identity Federation の設定
#      gcloud iam workload-identity-pools create github-pool \
#        --location=global \
#        --display-name="GitHub Actions Pool"
#      gcloud iam workload-identity-pools providers create-oidc github-provider \
#        --location=global \
#        --workload-identity-pool=github-pool \
#        --display-name="GitHub Actions Provider" \
#        --attribute-mapping="google.subject=assertion.sub,attribute.repository=assertion.repository" \
#        --attribute-condition="assertion.repository == 'kirin0198/SF6ComList'" \
#        --issuer-uri="https://token.actions.githubusercontent.com"
#
#   3. サービスアカウントの作成と権限付与
#      gcloud iam service-accounts create sf6comlist-deployer \
#        --display-name="SF6ComList Deployer"
#      # Artifact Registry への push 権限
#      gcloud projects add-iam-policy-binding PROJECT_ID \
#        --member="serviceAccount:sf6comlist-deployer@PROJECT_ID.iam.gserviceaccount.com" \
#        --role="roles/artifactregistry.writer"
#      # Cloud Run へのデプロイ権限
#      gcloud projects add-iam-policy-binding PROJECT_ID \
#        --member="serviceAccount:sf6comlist-deployer@PROJECT_ID.iam.gserviceaccount.com" \
#        --role="roles/run.developer"
#      # サービスアカウントの利用権限
#      gcloud iam service-accounts add-iam-policy-binding sf6comlist-deployer@PROJECT_ID.iam.gserviceaccount.com \
#        --member="serviceAccount:sf6comlist-deployer@PROJECT_ID.iam.gserviceaccount.com" \
#        --role="roles/iam.serviceAccountUser"
#
#   4. Workload Identity Federation の紐付け
#      gcloud iam service-accounts add-iam-policy-binding sf6comlist-deployer@PROJECT_ID.iam.gserviceaccount.com \
#        --role="roles/iam.workloadIdentityUser" \
#        --member="principalSet://iam.googleapis.com/WORKLOAD_IDENTITY_POOL_ID/attribute.repository/kirin0198/SF6ComList"
#
#   5. Cloud Storage バケットの作成（SQLite 永続化用）
#      gsutil mb -l asia-northeast1 gs://sf6comlist-db-UNIQUE_SUFFIX
#      gsutil versioning set on gs://sf6comlist-db-UNIQUE_SUFFIX
#      gsutil iam ch serviceAccount:sf6comlist-deployer@PROJECT_ID.iam.gserviceaccount.com:roles/storage.objectUser \
#        gs://sf6comlist-db-UNIQUE_SUFFIX
#
#   6. Secret Manager にシークレットを登録
#      echo -n "$(openssl rand -base64 32)" | \
#        gcloud secrets create AUTH_SECRET --data-file=- --replication-policy=automatic
#      gcloud secrets add-iam-policy-binding AUTH_SECRET \
#        --member="serviceAccount:sf6comlist-deployer@PROJECT_ID.iam.gserviceaccount.com" \
#        --role="roles/secretmanager.secretAccessor"
#
# GitHub Secrets に以下を設定すること:
#   GCP_PROJECT_ID          : Google Cloud プロジェクト ID
#   GCP_WORKLOAD_IDENTITY_PROVIDER : Workload Identity Provider のリソース名
#     例: projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github-provider
#   GCP_SERVICE_ACCOUNT     : サービスアカウントのメールアドレス
#     例: sf6comlist-deployer@PROJECT_ID.iam.gserviceaccount.com
#   GCS_BUCKET_NAME         : SQLite DB 永続化用 GCS バケット名
#     例: sf6comlist-db-abc123

name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  # Artifact Registry の設定
  REGION: asia-northeast1
  REPOSITORY: sf6comlist
  IMAGE_NAME: sf6comlist
  # Cloud Run の設定
  CLOUD_RUN_SERVICE: sf6comlist
  CLOUD_RUN_REGION: asia-northeast1

jobs:
  # ─────────────────────────────────────
  # Job 1: Lint + Test（デプロイ前の品質ゲート）
  # ─────────────────────────────────────
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:/tmp/test.db"
      AUTH_SECRET: "test-secret-for-ci-only-do-not-use-in-production"
      AUTH_URL: "http://localhost:3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: ESLint
        run: npx eslint .

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

  # ─────────────────────────────────────
  # Job 2: Build & Push to Artifact Registry
  # ─────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    outputs:
      image: ${{ steps.build.outputs.image }}

    permissions:
      contents: read
      id-token: write # Workload Identity Federation に必須

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image URL
        id: set-output
        run: |
          echo "image=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────
  # Job 3: Deploy to Cloud Run
  # ─────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.CLOUD_RUN_REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Cloud Run の設定
          flags: |
            --platform=managed
            --allow-unauthenticated
            --port=3000
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=1
            --concurrency=80
            --timeout=60s
            --execution-environment=gen2
          # 環境変数（Secret Manager 参照）
          env_vars: |
            NODE_ENV=production
            NEXT_TELEMETRY_DISABLED=1
            AUTH_URL=https://${{ env.CLOUD_RUN_SERVICE }}-${{ env.CLOUD_RUN_REGION }}.run.app
            GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}
            DATABASE_URL=file:/app/data/sf6combo.db
          secrets: |
            AUTH_SECRET=AUTH_SECRET:latest

      - name: Show deployed URL
        run: |
          echo "デプロイ完了: $(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.CLOUD_RUN_REGION }} \
            --format='value(status.url)')"
